name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trustvault_test
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vaultpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://vault:vaultpass@localhost:5432/trustvault_test
          SECRET_KEY: test-secret-key-32-bytes-long-ci-test
          ENCRYPTION_KEY: test-master-aes-gcm-key-32bytes-ci
          AUDIT_HMAC_KEY: test-audit-hmac-key-changeme-32b
          STORAGE_DIR: /tmp/trustvault_storage
          ENV: test
        run: |
          python -m pytest backend/tests -v

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
