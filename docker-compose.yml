services:
  db:
    image: postgres:16-alpine
    container_name: trustvault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustvault}
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-trustvault}"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://vault:vaultpass@db:5432/trustvault}
      SECRET_KEY: ${SECRET_KEY:-change-this-super-secret-key-in-production}
      STORAGE_DIR: ${STORAGE_DIR:-/var/vault/storage}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - vault_storage:/var/vault/storage

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustvault-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
  vault_storage:
